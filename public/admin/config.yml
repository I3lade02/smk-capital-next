# Konfigurace administrace obsahu (Sveltia CMS).
#
# Editor běží jako statická stránka na adrese https://smkcapital.cz/admin/.
# Přihlašuje se GitHub účtem a uložené změny zapisuje rovnou do repozitáře.
# Každý zápis spustí GitHub Actions, které web sestaví a nahrají na Endoru.
#
# !! PŘED PRVNÍM POUŽITÍM VYPLNIT `repo` a `base_url` – viz README.md.

backend:
  name: github
  repo: I3lade02/smk-capital-next # uživatel/repozitář na GitHubu
  branch: main
  # Adresa pomocné OAuth služby, která přihlášení přes GitHub zprostředkuje
  # (zdarma běží jako Cloudflare Worker – postup je v README.md).
  base_url: https://VYPLNIT.workers.dev
  site_domain: smkcapital.cz
  commit_messages:
    create: 'Obsah: nová položka „{{collection}}“'
    update: 'Obsah: úprava „{{collection}}“'
    delete: 'Obsah: smazání „{{collection}}“'
    uploadMedia: 'Obsah: nahrán soubor {{path}}'
    deleteMedia: 'Obsah: smazán soubor {{path}}'

# Změny se ukládají rovnou (bez schvalovacího workflow).
publish_mode: simple

# Kam se ukládají obrázky nahrané v administraci.
media_folder: public/uploads
public_folder: /uploads

locale: cs
site_url: https://smkcapital.cz
display_url: https://smkcapital.cz
logo_url: https://smkcapital.cz/images/logo_edit.png

# Seznam ikon, které umí web vykreslit. Musí odpovídat registru
# v souboru src/lib/icons.tsx – když se přidá ikona tam, přidejte ji i sem.
icon_options: &icon_options
  - ArrowLeft
  - ArrowRight
  - Bolt
  - BrandFacebook
  - BrandInstagram
  - BrandLinkedin
  - BrandTiktok
  - Briefcase
  - BuildingBank
  - Bulb
  - Calculator
  - Car
  - ChartPie
  - Check
  - ChevronRight
  - CircleCheck
  - ClockHour3
  - Coin
  - FileText
  - FileTypePdf
  - HeartHandshake
  - Home
  - HomeShield
  - Mail
  - MapPin
  - Phone
  - PhoneCall
  - Photo
  - ShieldCheck
  - Star
  - Stethoscope
  - UserCircle
  - UsersGroup

collections:
  - name: nastaveni
    label: Nastavení webu
    format: json
    files:
      - name: site
        label: Kontakty, logo a menu
        file: content/site.json
        description: Údaje, které se opakují na celém webu – telefon, e-mail, logo, sociální sítě a položky menu.
        fields:
          - { name: name, label: Název firmy (velkými písmeny), widget: string }
          - { name: shortName, label: Název firmy (běžný zápis), widget: string }
          - { name: slogan, label: Slogan v levém pruhu, widget: string }
          - { name: phone, label: Telefon (jak se zobrazuje), widget: string }
          - {
              name: phoneHref,
              label: Telefon pro proklik,
              widget: string,
              hint: "Ve tvaru tel:+420607845260 – na tohle číslo se zavolá po kliknutí.",
            }
          - { name: email, label: E-mail, widget: string }
          - {
              name: emailHref,
              label: E-mail pro proklik,
              widget: string,
              hint: "Ve tvaru mailto:info@smkcapital.cz",
            }
          - { name: ico, label: IČO, widget: string }
          - {
              name: address,
              label: Adresa,
              widget: list,
              required: false,
              field: { name: line, label: Řádek adresy, widget: string },
              hint: "Nechte prázdné, pokud se adresa nemá na webu zobrazovat.",
            }
          - { name: availability, label: Dostupnost, widget: string }
          - { name: logo, label: Logo, widget: image }
          - {
              name: ogImage,
              label: Náhledový obrázek pro sdílení,
              widget: image,
              hint: "Obrázek, který se ukáže při vložení odkazu na Facebook nebo LinkedIn.",
            }
          - {
              name: url,
              label: Adresa webu,
              widget: string,
              hint: "Bez lomítka na konci. Měnit jen při změně domény.",
            }
          - name: social
            label: Sociální sítě
            widget: list
            label_singular: odkaz
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Název sítě, widget: string }
              - { name: icon, label: Ikona, widget: select, options: *icon_options }
              - { name: href, label: Odkaz, widget: string }
          - name: footer
            label: Patička
            widget: object
            collapsed: true
            fields:
              - { name: servicesHeading, label: Nadpis sloupce se službami, widget: string }
              - { name: contactHeading, label: Nadpis sloupce s kontakty, widget: string }
              - { name: socialHeading, label: Nadpis sloupce se sítěmi, widget: string }
              - { name: copyright, label: Text za rokem, widget: string }
              - name: legalLinks
